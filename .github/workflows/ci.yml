name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: cfn-lint infra/template.yaml
      - run: python -m pytest -q
      # A change to the ban list, the label table, a note or a template has to pass these before it ships.
      - run: python eval/run_eval.py
      - run: python eval/gate_mutations.py
